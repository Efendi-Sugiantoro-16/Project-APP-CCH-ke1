<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="posindBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2C4F" />
      <stop offset="100%" stop-color="#141E36" />
    </linearGradient>
  </defs>

  <!-- Deep Navy Corporate Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#posindBg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />

  <!-- "POS" Top Line -->
  <text x="32" y="27" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="21" 
        font-weight="900" 
        fill="#FFFFFF" 
        letter-spacing="-0.5px" 
        text-anchor="middle">POS</text>

  <!-- "iND" Bottom Line -->
  <g transform="translate(11, 31)">
    <!-- Iconic Orange Quarter-Circle Dot for the letter 'i' -->
    <path d="M4 3.5 A5.5 5.5 0 0 1 9.5 9 H4 V3.5 Z" fill="#EA580C" />
    <!-- 'i' stem -->
    <rect x="4" y="11" width="5.5" height="13" rx="1.5" fill="#FFFFFF" />

    <!-- 'N' letter -->
    <path d="M13 11 H18 L24.5 19.5 V11 H29.5 V24 H24.5 L18 15.5 V24 H13 Z" fill="#FFFFFF" />

    <!-- 'D' letter -->
    <path d="M33 11 H39 C43 11 46 13.8 46 17.5 C46 21.2 43 24 39 24 H33 Z M37.5 14.5 V20.5 H39 C40.8 20.5 42 19.3 42 17.5 C42 15.7 40.8 14.5 39 14.5 Z" fill="#FFFFFF" />
  </g>
</svg>